<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Today's Tasks · To-Do</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="board">

    <header class="board-header">
      <div class="header-top">
        <p class="eyebrow">Date · <span id="today-date"></span></p>
        <span class="pin" aria-hidden="true"></span>
      </div>
      <h1>Today's Tasks</h1>
      <p class="tagline">Write down what you need to do — we'll keep track of the rest.</p>
    </header>

    <form id="todo-form">
      <input type="text" id="todo-input" placeholder="Add a new task..." autocomplete="off">
      <button type="submit" aria-label="Add task">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M9 2V16M2 9H16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </form>

    <div class="toolbar">
      <div class="filters">
        <button class="filter-btn active" data-filter="all">All </button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>
      <span id="items-left" class="items-left">0 tasks left</span>
    </div>

    <ul id="todo-list"></ul>

    <div class="footer">
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <button id="clear-completed">Clear Completed</button>
    </div>
  </div>

<script type="module" src="script.js"></script>
</body>
</html>
